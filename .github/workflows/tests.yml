name: Tests

on:
  push:
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
